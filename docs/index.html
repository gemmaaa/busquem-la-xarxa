<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busquem la Xarxa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 data-i18n="app_title">Busquem la Xarxa</h1>
  <div class="header-controls">
    <select id="theme" aria-label="Theme">
      <option value="default">Default</option>
      <option value="lavender">Lavender</option>
      <option value="matcha">Matcha</option>
      <option value="dark">Dark</option>
    </select>
    <select id="lang" aria-label="Language">
      <option value="ca">Català</option>
      <option value="es">Castellano</option>
      <option value="en">English</option>
    </select>
  </div>
</header>

<section class="controls">
  <p class="explain" data-i18n="explain">Filtra per data o dia de la setmana. Tots els camps són opcionals.</p>

  <div class="filter-row">
    <label>
      <span data-i18n="date">Data</span>
      <input type="date" id="date-input">
    </label>
    <label>
      <span data-i18n="day">Dia de la setmana</span>
      <select id="day-input">
        <option value="" data-i18n="any_day">Qualsevol</option>
        <option value="1" data-i18n="monday">Dilluns</option>
        <option value="2" data-i18n="tuesday">Dimarts</option>
        <option value="3" data-i18n="wednesday">Dimecres</option>
        <option value="4" data-i18n="thursday">Dijous</option>
        <option value="5" data-i18n="friday">Divendres</option>
        <option value="6" data-i18n="saturday">Dissabte</option>
        <option value="0" data-i18n="sunday">Diumenge</option>
      </select>
    </label>
    <label>
      <span data-i18n="from">De</span>
      <input type="time" id="time-from" step="900">
    </label>
    <label>
      <span data-i18n="to">A</span>
      <input type="time" id="time-to" step="900">
    </label>
    <label>
      <span data-i18n="municipality">Municipi</span>
      <input type="text" id="municipality" list="municipality-list" placeholder="...">
      <datalist id="municipality-list"></datalist>
    </label>
  </div>

  <div class="filter-row button-row">
    <label class="radius-label">
      <span data-i18n="radius">Radi (km)</span>
      <input type="number" id="radius" value="5" min="0.5" step="0.5">
    </label>

    <label class="open-only-label">
      <input type="checkbox" id="open-only">
      <span data-i18n="only_open">Només obertes</span>
    </label>

    <button id="use-location" type="button" data-i18n="use_location">La meva ubicació</button>
    <button id="search" type="button" class="btn-primary" data-i18n="search">Cercar</button>
    <button id="reset" type="button" class="btn-secondary" data-i18n="reset">Netejar</button>
  </div>
</section>

<main>
  <div id="results"></div>
  <div id="map-wrap" hidden>
    <div id="map"></div>
  </div>
</main>

<div id="view-toggle" hidden>
  <button id="toggle-view" type="button" data-i18n="view_map">Veure al mapa</button>
</div>

<footer>
  <span id="footer-text">Dades: Diputació de Barcelona (CC BY 4.0)</span>
</footer>

<template id="card-template">
  <article class="card">
    <h2 class="name"></h2>
    <p class="meta"></p>
    <p class="status"></p>
    <p class="hours"></p>
    <details class="obs">
      <summary data-i18n="observations">Observacions</summary>
      <p class="obs-text"></p>
    </details>
    <p class="links"></p>
  </article>
</template>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
